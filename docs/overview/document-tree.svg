<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" role="img" aria-labelledby="title desc">
<title id="title">Document Tree</title>
<desc id="desc">A root Parent Document has three children: a Text, a Parent, and an Asset. The nested Parent has two children of its own, a Text and an Asset, so it is both a Parent and a Child.</desc>
<style>
	.bg { fill: #ffffff; }
	text { fill: #1f2328; font-family: system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 14px; }
	.small { font-size: 12px; fill: #59636e; }
	.label { font-weight: 600; }
	.input { fill: #f6f8fa; stroke: #59636e; }
	.stage { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.5; }
	.artifact { fill: #fff8c5; stroke: #9a6700; }
	.external { fill: #f6f8fa; stroke: #59636e; stroke-dasharray: 5 4; stroke-width: 1.5; }
	.line { stroke: #59636e; stroke-width: 1.5; fill: none; }
	.head { fill: #59636e; }
	.parent { fill: #ddf4ff; stroke: #0969da; }
	.text { fill: #dafbe1; stroke: #1a7f37; }
	.asset { fill: #fff8c5; stroke: #9a6700; }
	@media (prefers-color-scheme: dark) {
		.bg { fill: #0d1117; }
		text { fill: #e6edf3; }
		.small { fill: #9198a1; }
		.input, .external { fill: #161b22; stroke: #9198a1; }
		.stage, .parent { fill: #0c2d6b; stroke: #4493f8; }
		.artifact, .asset { fill: #3b2e00; stroke: #d29922; }
		.text { fill: #04260f; stroke: #3fb950; }
		.line { stroke: #9198a1; }
		.head { fill: #9198a1; }
	}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="640" height="320" rx="8"/>
<path class="line" d="M320,72 L140,112"/>
<path class="line" d="M320,72 L320,112"/>
<path class="line" d="M320,72 L500,112"/>
<path class="line" d="M320,160 L240,200"/>
<path class="line" d="M320,160 L400,200"/>
<rect class="parent" x="260" y="24" width="120" height="48" rx="6"/>
<text x="320" y="53" text-anchor="middle" class="label">Parent</text>
<rect class="text" x="80" y="112" width="120" height="48" rx="6"/>
<text x="140" y="141" text-anchor="middle" class="label">Text</text>
<rect class="parent" x="260" y="112" width="120" height="48" rx="6"/>
<text x="320" y="132.5" text-anchor="middle" class="label">Parent</text>
<text x="320" y="149.5" text-anchor="middle" class="small">and a Child</text>
<rect class="asset" x="440" y="112" width="120" height="48" rx="6"/>
<text x="500" y="141" text-anchor="middle" class="label">Asset</text>
<rect class="text" x="180" y="200" width="120" height="48" rx="6"/>
<text x="240" y="229" text-anchor="middle" class="label">Text</text>
<rect class="asset" x="340" y="200" width="120" height="48" rx="6"/>
<text x="400" y="229" text-anchor="middle" class="label">Asset</text>
<rect class="parent" x="24" y="286" width="14" height="14" rx="3"/>
<text x="44" y="298" class="small">Parent: has children</text>
<rect class="text" x="208" y="286" width="14" height="14" rx="3"/>
<text x="228" y="298" class="small">Text: resolved eagerly</text>
<rect class="asset" x="406" y="286" width="14" height="14" rx="3"/>
<text x="426" y="298" class="small">Asset: handled specially</text>
</svg>
