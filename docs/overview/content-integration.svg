<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 232" width="760" height="232" role="img" aria-labelledby="title desc">
<title id="title">Content Integration</title>
<desc id="desc">Content Integration takes the Normalized Data produced by Data Ingestion, renderers, and site components, and produces Content.</desc>
<style>
	.bg { fill: #ffffff; }
	text { fill: #1f2328; font-family: system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 14px; }
	.small { font-size: 12px; fill: #59636e; }
	.label { font-weight: 600; }
	.input { fill: #f6f8fa; stroke: #59636e; }
	.stage { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.5; }
	.artifact { fill: #fff8c5; stroke: #9a6700; }
	.external { fill: #f6f8fa; stroke: #59636e; stroke-dasharray: 5 4; stroke-width: 1.5; }
	.line { stroke: #59636e; stroke-width: 1.5; fill: none; }
	.head { fill: #59636e; }
	.parent { fill: #ddf4ff; stroke: #0969da; }
	.text { fill: #dafbe1; stroke: #1a7f37; }
	.asset { fill: #fff8c5; stroke: #9a6700; }
	@media (prefers-color-scheme: dark) {
		.bg { fill: #0d1117; }
		text { fill: #e6edf3; }
		.small { fill: #9198a1; }
		.input, .external { fill: #161b22; stroke: #9198a1; }
		.stage, .parent { fill: #0c2d6b; stroke: #4493f8; }
		.artifact, .asset { fill: #3b2e00; stroke: #d29922; }
		.text { fill: #04260f; stroke: #3fb950; }
		.line { stroke: #9198a1; }
		.head { fill: #9198a1; }
	}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="760" height="232" rx="8"/>
<rect class="artifact" x="24" y="24" width="200" height="44" rx="6"/>
<text x="124" y="42.5" text-anchor="middle" class="label">Normalized Data</text>
<text x="124" y="59.5" text-anchor="middle" class="small">from Data Ingestion</text>
<path class="line" d="M224,46 C244,46 244,102 264,102"/>
<rect class="input" x="24" y="80" width="200" height="44" rx="6"/>
<text x="124" y="107" text-anchor="middle" class="label">Renderers</text>
<path class="line" d="M224,102 C244,102 244,102 264,102"/>
<rect class="input" x="24" y="136" width="200" height="44" rx="6"/>
<text x="124" y="163" text-anchor="middle" class="label">Site Components</text>
<path class="line" d="M224,158 C244,158 244,102 264,102"/>
<path class="line" d="M264,102 L298,102" marker-end="url(#arrow)"/>
<rect class="stage" x="300" y="70" width="200" height="64" rx="6"/>
<text x="400" y="107" text-anchor="middle" class="label">Content Integration</text>
<path class="line" d="M500,102 L574,102" marker-end="url(#arrow)"/>
<rect class="artifact" x="576" y="80" width="160" height="44" rx="6"/>
<text x="656" y="107" text-anchor="middle" class="label">Content</text>
<rect class="input" x="24" y="206" width="14" height="14" rx="3"/>
<text x="44" y="218" class="small">Input</text>
<rect class="artifact" x="103" y="206" width="14" height="14" rx="3"/>
<text x="123" y="218" class="small">Produced by a stage</text>
<rect class="stage" x="280" y="206" width="14" height="14" rx="3"/>
<text x="300" y="218" class="small">Stage</text>
</svg>
