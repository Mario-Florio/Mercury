<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="640" height="220" role="img" aria-labelledby="title desc">
<title id="title">Package dependencies</title>
<desc id="desc">A site depends on its adapter, @mercurypress/astro, and on core, @mercurypress/core. The adapter depends on core. Core depends on neither.</desc>
<style>
	.bg { fill: #ffffff; }
	text { fill: #1f2328; font-family: system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 14px; }
	.small { font-size: 12px; fill: #59636e; }
	.label { font-weight: 600; }
	.input { fill: #f6f8fa; stroke: #59636e; }
	.stage { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.5; }
	.artifact { fill: #fff8c5; stroke: #9a6700; }
	.external { fill: #f6f8fa; stroke: #59636e; stroke-dasharray: 5 4; stroke-width: 1.5; }
	.line { stroke: #59636e; stroke-width: 1.5; fill: none; }
	.head { fill: #59636e; }
	.parent { fill: #ddf4ff; stroke: #0969da; }
	.text { fill: #dafbe1; stroke: #1a7f37; }
	.asset { fill: #fff8c5; stroke: #9a6700; }
	@media (prefers-color-scheme: dark) {
		.bg { fill: #0d1117; }
		text { fill: #e6edf3; }
		.small { fill: #9198a1; }
		.input, .external { fill: #161b22; stroke: #9198a1; }
		.stage, .parent { fill: #0c2d6b; stroke: #4493f8; }
		.artifact, .asset { fill: #3b2e00; stroke: #d29922; }
		.text { fill: #04260f; stroke: #3fb950; }
		.line { stroke: #9198a1; }
		.head { fill: #9198a1; }
	}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="640" height="220" rx="8"/>
<rect class="input" x="24" y="88" width="140" height="48" rx="6"/>
<text x="94" y="117" text-anchor="middle" class="label">Site</text>
<rect class="external" x="250" y="24" width="200" height="52" rx="6"/>
<text x="350" y="46.5" text-anchor="middle" class="label">Adapter</text>
<text x="350" y="63.5" text-anchor="middle" class="small">@mercurypress/astro</text>
<rect class="stage" x="416" y="148" width="200" height="52" rx="6"/>
<text x="516" y="170.5" text-anchor="middle" class="label">Core</text>
<text x="516" y="187.5" text-anchor="middle" class="small">@mercurypress/core</text>
<path class="line" d="M164,104 L248,56" marker-end="url(#arrow)"/>
<path class="line" d="M164,124 L414,170" marker-end="url(#arrow)"/>
<path class="line" d="M450,64 L500,146" marker-end="url(#arrow)"/>
</svg>
